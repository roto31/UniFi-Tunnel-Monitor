name: Release pkg

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0). Defaults to the tag without v prefix."
        required: false

permissions:
  contents: write

concurrency:
  group: m4-macos
  cancel-in-progress: false

jobs:
  build-pkg:
    name: Build & release .pkg
    runs-on: [self-hosted, macOS, ARM64, m4-homelab]
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_INSTALLER:   ${{ secrets.DEVELOPER_ID_INSTALLER }}
      APPLE_ID:                 ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID:            ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      MACOS_CERT_P12_BASE64:    ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_P12_PASSWORD:  ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD:             ${{ secrets.P12_PASSWORD }}
      ASC_KEY_P8_BASE64:        ${{ secrets.ASC_KEY_P8_BASE64 }}
      ASC_KEY_ID:               ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:            ${{ secrets.ASC_ISSUER_ID }}
      NOTARY_TEAM_ID:           ${{ secrets.NOTARY_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            V="0.0.0-dev"
          fi
          echo "version=${V}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${V}"

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "${GITHUB_ENV}"
            export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version

      - name: Import signing cert
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.MACOS_CERT_P12_PASSWORD || secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_B64}" ]]; then
            echo "No p12 secret — using host keychain identities if present."
            if security find-identity -v -p codesigning 2>/dev/null | grep -q "Developer ID Application"; then
              echo "Host keychain has Developer ID Application identity."
            else
              echo "WARN: no Developer ID Application identity in host keychain."
            fi
            exit 0
          fi
          CERT="${RUNNER_TEMP}/signing.p12"
          KEYCHAIN="${RUNNER_TEMP}/build.keychain"
          KEYCHAIN_PWD="github-actions"
          echo "${CERT_B64}" | base64 --decode > "${CERT}"
          rm -f "${KEYCHAIN}"
          security create-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security import "${CERT}" -k "${KEYCHAIN}" -P "${CERT_PASS}" \
              -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          # Developer ID Application (G2) is not trusted without this intermediate.
          G2_CER="${RUNNER_TEMP}/DeveloperIDG2CA.cer"
          curl -fsSL "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer" -o "${G2_CER}"
          security import "${G2_CER}" -k "${KEYCHAIN}" -T /usr/bin/codesign >/dev/null
          rm -f "${G2_CER}"
          # Quiet: this command dumps every key label to stdout.
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PWD}" "${KEYCHAIN}" >/dev/null
          # LaunchAgent cannot use login-keychain private-key ACLs (errSecInternalComponent).
          # Keep System.keychain so Apple Root CA can validate Developer ID G2.
          # Restore login in the always() cleanup step — this is a self-hosted runner.
          security list-keychains -d user -s "${KEYCHAIN}" /Library/Keychains/System.keychain
          security default-keychain -d user -s "${KEYCHAIN}"
          rm -f "${CERT}"
          echo "CODESIGN_KEYCHAIN=${KEYCHAIN}" >> "${GITHUB_ENV}"
          if ! security find-identity -v -p codesigning "${KEYCHAIN}" | grep -q "Developer ID Application"; then
            echo "ERROR: p12 imported but no valid Developer ID Application identity found." >&2
            exit 1
          fi
          echo "Imported Developer ID identities into ephemeral keychain."

      - name: Write App Store Connect API key
        run: |
          set -euo pipefail
          if [[ -z "${ASC_KEY_P8_BASE64}" ]]; then
            echo "ASC_KEY_P8_BASE64 empty — notarization will be skipped unless Apple ID secrets are set."
            exit 0
          fi
          KEY="${RUNNER_TEMP}/AuthKey.p8"
          echo "${ASC_KEY_P8_BASE64}" | base64 --decode > "${KEY}"
          chmod 600 "${KEY}"
          echo "ASC_KEY_P8_PATH=${KEY}" >> "${GITHUB_ENV}"

      - name: Build menu bar app
        env:
          APP_SRC: ${{ github.workspace }}/mac/app/TunnelMonitor
          DIST_DIR: ${{ github.workspace }}/build/dist
        run: |
          VERSION="${{ steps.ver.outputs.version }}" bash build/build-app.sh

      - name: Build .pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}" bash build/build-pkg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: tunnel-monitor-pkg-${{ steps.ver.outputs.version }}
          path: |
            build/releases/*/Tunnel-Monitor-*.pkg
            build/dist/Tunnel-Monitor-*.pkg

      - name: Select release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if [[ -f "docs/release-notes/v${V}.md" ]]; then
            cp "docs/release-notes/v${V}.md" release-body.md
          else
            printf '%s\n' "See [mac/CHANGELOG.md](mac/CHANGELOG.md) for ${V}." > release-body.md
          fi

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-body.md
          files: |
            build/releases/*/Tunnel-Monitor-*.pkg
            build/dist/Tunnel-Monitor-*.pkg

      - name: Restore login keychain
        if: always()
        run: |
          set -euo pipefail
          LOGIN="${HOME}/Library/Keychains/login.keychain-db"
          SYSTEM="/Library/Keychains/System.keychain"
          security list-keychains -d user -s "${LOGIN}" "${SYSTEM}"
          security default-keychain -d user -s "${LOGIN}"
          echo "Restored user keychain search list to login + System."
